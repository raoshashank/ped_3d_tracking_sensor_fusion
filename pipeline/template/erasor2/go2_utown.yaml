# ERASOR2 config for the Go2 utown bag (HeLiPR loader, sensor "Merged").
# Algorithm settings follow ERASOR2/config/erasor2/seq_05.yaml; spatial ones are scaled for the Go2.
# Paths are absolute: update them if the bag folder moves.
# Heights are in the rslidar frame; ground is ~0.38 m below the lidar.
start_frame: 0
end_frame: 434          # loop reads up to end_frame + accum_interval - 1 = 435 (437 scans)
viz_interval: 10
is_large_scale: true
num_omp_cores: 8        # this machine is unstable under all-core load
stop_for_each_frame: false

dataloader:
  run_traj_clustering: false
  dataset_name: "HeLiPR"
  abs_data_dir: "<bag>/slam_output/erasor2/data"        # filled in per bag by run_all.py (write_yamls)
  cloud_dir: ""
  cloud_format: ""
  pose_path: ""
  sequence: "Merged"
  abs_save_dir: "<bag>/slam_output/erasor2/output"
  instance_seg_method: "hdbscan"
  accum_interval: 2
  expansion_range: 0
  voxel_size: 0.05
  map_voxel_size: 0.05

erasor2:
  # KITTI: 2.0 m grid, 60 m range. The Go2 sees mostly people within ~10 m.
  grid_resolution: 0.4
  egocentric_grid_resolution: 0.2
  range_of_interest: 10.0
  # Heights in the raw lidar frame (ground at -0.38). ERASOR2 (unlike ERASOR 1) needs the ground
  # inside the VoI: its ground-likelihood grid only counts points still labelled ground, and every
  # shipped config puts min_z_voi 1.3-2.8 m below the ground. -1.0 = 0.6 m below (slopes);
  # max 1.8 = 2.2 m above ground (covers standing people).
  min_z_voi: -1.0
  max_z_voi: 1.8
  min_z_diff_thr: 0.4
  scan_ratio_threshold: 0.2
  log_odds:
    increment_gain: 2.0 # Should be larger than one
    increment: 0.15
  region_proposal_thr: 0.8
  kernel_size: 1

  ratio_num_pts: 0.95
  minimum_num_pts: 5

  moving_object_detection:
    negative_log_odds: -2.0
    obj_score_soft_thr: 0.8
    obj_score_hard_thr: 14.0
    hard_thr_radius: 10.0

  over_segmentation:
    minimum_area_thr: 2.24 # [m^2] = 14 grid cells, same cell count as KITTI's 56 m^2 at 2 m
    ratio_of_unknown_prior: 0.25

  volumetric_outlier_removal:
    window_size: 1
    use_adaptive_voxel_size: true
    vor_cand_score_thr: 3.0
    dist_thr_gain: 1.732

  viz_flag:
    set_scan_and_pose: false
    set_submap: false
    update: false
    detect: false
    over_seg: false

  save_map: true

extrinsic:
  robot_body_size: 0.6   # radius of self-returns to drop (m); KITTI car uses 2.7
  sensor_height: 0.38
  rotation: [1, 0, 0,
             0, 1, 0,
             0, 0, 1]
  translation: [0.0, 0.0, 0.0]

rerun:
  enabled: true
  spawn: false
  save_path: "<bag>/slam_output/erasor2/output/erasor2_run.rrd"
